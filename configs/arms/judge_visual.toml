schema_version = 1
arm = "judge_visual"
status = "implemented"
default = "deny"

[evidence]
live_app = false
ui_structure = false
test_source = false
screenshot_sequence = true
steps = "optional"

[files]
read = ["/workspace/instruction.md","/workspace/output/*","/workspace/steps.json","/workspace/evidence/manifest.json","/workspace/evidence/screenshots/*.png"]
write = ["/workspace/output/*"]

[tools]
allow = []
execute_submission = false

[environment]
inherit = false
runtime_names = ["PATH", "HOME", "LANG", "TMPDIR", "XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_CACHE_HOME", "OPENCODE_CONFIG", "OPENCODE_DISABLE_DEFAULT_PLUGINS", "OPENCODE_DISABLE_MODELS_FETCH", "OPENCODE_DISABLE_CLAUDE_CODE", "OPENCODE_DISABLE_AUTOUPDATE"]
provider_names = ["OPENROUTER_API_KEY", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_GENERATIVE_AI_API_KEY"]

[submission]
kind = "judgment"
path = "/workspace/output/judgment.json"
