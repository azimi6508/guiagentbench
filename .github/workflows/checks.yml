name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[visual,codex,dev]'
      - run: python -m black --check src scripts tests runtime
      - run: python scripts/check_structure.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/viewer_frontend.cjs
      - run: node --test runtime/aura/app/tests/*.mjs
      - run: python -m pip wheel --no-deps --wheel-dir /tmp/gui-bench-wheels .
      - run: python scripts/check_wheel.py /tmp/gui-bench-wheels/gui_agent_bench-*.whl
